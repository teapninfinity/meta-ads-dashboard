<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Ads Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dashboardPage" class="dashboard-container">
    <div class="header">
      <h1>📊 Meta Ads Dashboard</h1>
      <button id="settingsBtn" class="btn-settings">⚙️ ตั้งค่า</button>
    </div>

    <div class="filters-section">
      <div class="filter-group">
        <label>UNIT:</label>
        <select id="unitFilter">
          <option value="ALL">ทั้งหมด</option>
          <option value="UNIT A">UNIT A</option>
          <option value="UNIT B">UNIT B</option>
          <option value="UNIT C">UNIT C</option>
        </select>
      </div>

      <div class="filter-group">
        <label>เพจ:</label>
        <select id="pageFilter">
          <option value="ALL">ทั้งหมด</option>
          <option value="เพจ 1">เพจ 1</option>
          <option value="เพจ 2">เพจ 2</option>
          <option value="เพจ 3">เพจ 3</option>
        </select>
      </div>

      <div class="filter-group">
        <label>ประเภท:</label>
        <select id="typeFilter">
          <option value="ALL">ทั้งหมด</option>
          <option value="SCALE">ตัวสเกล</option>
          <option value="RE">ตัวรี</option>
        </select>
      </div>

      <div class="filter-group">
        <label>มีเดีย:</label>
        <select id="mediaFilter">
          <option value="GROUPED">รวมภาพสื่อซ้ำ</option>
          <option value="SEPARATE">แยกรายแอด</option>
        </select>
      </div>

      <button id="refreshBtn" class="btn-refresh">🔄 รีเฟรช</button>
    </div>

    <div id="dashboardContent" class="dashboard-content">
      <div class="loading">กำลังโหลด...</div>
    </div>
  </div>

  <div id="settingsPage" class="settings-page hidden">
    <div class="settings-container">
      <div class="settings-header">
        <h2>⚙️ ตั้งค่า</h2>
        <button id="closeSettingsBtn" class="btn-close">✕</button>
      </div>

      <div class="settings-content">
        <div class="settings-group">
          <label>Meta Access Token:</label>
          <input type="password" id="metaToken" placeholder="ป้อน Access Token">
          <small>🔒 บันทึกใน LocalStorage</small>
        </div>

        <div class="settings-group">
          <label>Ad Account ID:</label>
          <input type="text" id="adAccountId" placeholder="ป้อน Ad Account ID">
        </div>

        <div class="settings-group">
          <label>ล็อก UNIT:</label>
          <select id="lockedUnit">
            <option value="">ไม่ล็อก</option>
            <option value="UNIT A">UNIT A</option>
            <option value="UNIT B">UNIT B</option>
            <option value="UNIT C">UNIT C</option>
          </select>
        </div>

        <div class="settings-group">
          <label>ชื่อเพจ:</label>
          <textarea id="pageNames" placeholder="UNIT A: เพจหลัก&#10;UNIT B: เพจรอง"></textarea>
        </div>

        <button id="saveSettingsBtn" class="btn-save">💾 บันทึก</button>
      </div>
    </div>
  </div>

  <div id="imageModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="modal-close">✕</button>
      <img id="modalImage" src="" alt="Media">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
